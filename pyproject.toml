[project]
name = "miband-heart-rate-web-wss"
version = "0.1.0"
description = "Multi-person MiBand heart-rate monitor with Firebase or FastAPI WebSocket backends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
miband-hr = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

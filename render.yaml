# 僅作 Dashboard 對照，不必用 Blueprint（Blueprint 會連 Git）。
# 不連 GitHub：本機建映像 → 推 Docker Hub → Render 選 Existing Image。
services:
  - type: web
    name: miband-heart-rate-web-wss
    runtime: image
    plan: free
    region: singapore
    image:
      url: docker.io/YOUR_DOCKERHUB_USER/miband-heart-rate-web-wss:latest
    healthCheckPath: /api/health
    envVars:
      - key: MIBAND_BACKEND
        value: fastapi_wss

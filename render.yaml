# Render Blueprint（New → Blueprint 會讀這個檔）
services:
  - type: web
    name: miband-heart-rate-web-wss
    runtime: python
    plan: free
    region: singapore
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run python main.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: MIBAND_BACKEND
        value: fastapi_wss

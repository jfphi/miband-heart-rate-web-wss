<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>發布心率</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <main class="shell">
      <div class="topbar">
        <div>
          <h1 class="brand">發布心率</h1>
          <p class="lead" style="margin-bottom: 0">連接手環並推送到房間</p>
        </div>
        <a class="meta" href="./index.html">← 回首頁</a>
      </div>

      <section class="panel">
        <div class="row" style="justify-content: space-between">
          <div>
            <div class="meta">房間碼</div>
            <div class="room-code" id="roomCode">------</div>
          </div>
          <div>
            <div class="meta">後端</div>
            <div id="backendLabel">—</div>
          </div>
          <div>
            <div class="meta">版本</div>
            <div id="appVersion" class="app-version">—</div>
          </div>
        </div>

        <div class="row" style="margin-top: 16px">
          <span class="status idle" id="roomStatus">房間未連線</span>
          <span class="status idle" id="bleStatus">藍牙未連線</span>
        </div>

        <div id="liveReadout"></div>
        <div class="meta" id="rosterMeta">房間人數：0</div>

        <div class="row" style="margin-top: 18px">
          <button id="connectBle" type="button">連接小米手環</button>
          <button id="disconnectBle" class="secondary" type="button" disabled>斷開藍牙</button>
          <button id="copyLink" class="secondary" type="button">複製監看連結</button>
        </div>

        <div class="row" style="margin-top: 12px">
          <button id="openMic" type="button">開啟麥克風</button>
          <button id="stopMic" class="secondary" type="button" disabled>停止麥克風</button>
        </div>
        <p class="hint" style="margin-top: 10px">只同步音量，不錄音、不傳聲音</p>

        <p id="error" class="error" hidden></p>
        <p class="hint" style="margin-top: 14px">
          請先在手環設定開啟心率廣播 / Share HR。僅 Chrome、Edge 可作為發布端。
        </p>
      </section>

      <section class="panel lovense-panel" id="lovensePanel" hidden>
        <h2>玩具控制</h2>
        <div class="row">
          <span class="status idle" id="lovenseStatus">尚未連接</span>
        </div>
        <p class="hint">只控制這台瀏覽器授權的玩具，不會同步到房間。</p>
        <div class="row">
          <button id="lovenseConnect" type="button">連接玩具</button>
          <button id="lovenseOpenApp" class="secondary" type="button" hidden disabled>打開 App</button>
          <button id="lovenseDisconnect" class="secondary" type="button" disabled>斷線</button>
        </div>
        <img id="lovenseQr" class="lovense-qr" alt="Lovense 授權 QR code" hidden />
        <p class="meta" id="lovenseToys" hidden></p>
        <div id="lovenseRemote" class="lovense-remote" hidden></div>
        <p id="lovenseError" class="error" hidden></p>
      </section>
    </main>
    <script type="module">
      const { bootPage } = await import(`./js/asset-refresh.js?t=${Date.now()}`);
      await bootPage('./js/publish.js');
    </script>
  </body>
</html>
